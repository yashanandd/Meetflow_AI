apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: yashanandd/meetflow-backend:v1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: meetflow-config
